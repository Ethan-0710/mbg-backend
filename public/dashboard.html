<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Supir MBG</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    h1 { color: #333; }
    h2 { color: #555; margin-top: 30px; }
    table { border-collapse: collapse; width: 100%; background: white; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
    th { background: #333; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
    .refresh { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-bottom: 10px; }
    .refresh:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>Dashboard Supir MBG</h1>
  <button class="refresh" onclick="loadAll()">Refresh Data</button>

  <h2>Data GPS</h2>
  <table id="gpsTable">
    <thead>
      <tr><th>ID</th><th>Device</th><th>Latitude</th><th>Longitude</th><th>Waktu</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>Data Akselerometer</h2>
  <table id="accTable">
    <thead>
      <tr><th>ID</th><th>Device</th><th>X</th><th>Y</th><th>Z</th><th>Waktu</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadAll() {
      // Load GPS
      const gps = await (await fetch('/api/gps/list')).json();
      const gpsBody = document.querySelector('#gpsTable tbody');
      gpsBody.innerHTML = gps.map(r => `
        <tr>
          <td>${r.id}</td>
          <td>${r.device_id}</td>
          <td>${r.latitude}</td>
          <td>${r.longitude}</td>
          <td>${new Date(r.timestamp).toLocaleString('id-ID')}</td>
        </tr>
      `).join('');

      // Load Akselerometer
      const acc = await (await fetch('/api/accelerometer/list')).json();
      const accBody = document.querySelector('#accTable tbody');
      accBody.innerHTML = acc.map(r => `
        <tr>
          <td>${r.id}</td>
          <td>${r.device_id}</td>
          <td>${r.x}</td>
          <td>${r.y}</td>
          <td>${r.z}</td>
          <td>${new Date(r.timestamp).toLocaleString('id-ID')}</td>
        </tr>
      `).join('');
    }

    loadAll(); // auto-load saat halaman dibuka
  </script>
</body>
</html>
