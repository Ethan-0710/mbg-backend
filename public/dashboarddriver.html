<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Driver</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-6xl mx-auto">
        <!-- HEADER -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Dashboard Monitoring Driver</h1>
                <p class="text-sm text-gray-500">Analisis perjalanan supir: rumah → kampus.</p>
            </div>
            
            <!-- FILTER TANGGAL -->
            <div class="flex items-center gap-2 bg-white p-2 rounded-lg shadow-xs">
                <label for="filterTanggal" class="text-sm font-semibold text-gray-700">Pilih Hari:</label>
                <input type="date" id="filterTanggal" class="border rounded px-2 py-1 text-sm focus:outline-blue-500">
            </div>
        </div>

        <!-- RINGKASAN PERJALANAN -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-xs border-l-4 border-red-500">
                <span class="text-xs font-semibold text-gray-400 block uppercase">🏠 Waktu Berangkat</span>
                <span id="txtBerangkat" class="text-lg font-bold text-gray-700">-</span>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-xs border-l-4 border-green-500">
                <span class="text-xs font-semibold text-gray-400 block uppercase">🏫 Waktu Tiba</span>
                <span id="txtTiba" class="text-lg font-bold text-gray-700">-</span>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-xs border-l-4 border-amber-500">
                <span class="text-xs font-semibold text-gray-400 block uppercase">⏱️ Waktu Perjalanan</span>
                <span id="txtDurasi" class="text-lg font-bold text-gray-700">-</span>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-xs border-l-4 border-purple-500">
                <span class="text-xs font-semibold text-gray-400 block uppercase">📍 Total Titik</span>
                <span id="txtTotal" class="text-lg font-bold text-gray-700">-</span>
            </div>
        </div>

        <!-- STATISTIK KATEGORI -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-red-50 p-4 rounded-xl shadow-xs border-l-4 border-red-500">
                <span class="text-xs font-semibold text-red-400 block uppercase">🏠 Rumah</span>
                <span id="txtRumah" class="text-2xl font-bold text-red-700">0</span>
                <span class="text-xs text-red-500">titik</span>
            </div>
            <div class="bg-yellow-50 p-4 rounded-xl shadow-xs border-l-4 border-yellow-500">
                <span class="text-xs font-semibold text-yellow-600 block uppercase">🚗 Di Jalan</span>
                <span id="txtJalan" class="text-2xl font-bold text-yellow-700">0</span>
                <span class="text-xs text-yellow-600">titik</span>
            </div>
            <div class="bg-green-50 p-4 rounded-xl shadow-xs border-l-4 border-green-500">
                <span class="text-xs font-semibold text-green-600 block uppercase">🏫 Kampus</span>
                <span id="txtKampus" class="text-2xl font-bold text-green-700">0</span>
                <span class="text-xs text-green-600">titik</span>
            </div>
        </div>

        <!-- TABEL DATA -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-800 text-white text-sm uppercase">
                            <th class="p-4">ID</th>
                            <th class="p-4">Waktu</th>
                            <th class="p-4">Latitude</th>
                            <th class="p-4">Longitude</th>
                            <th class="p-4">Jarak ke Rumah</th>
                            <th class="p-4">Jarak ke Kampus</th>
                            <th class="p-4 text-center">Kategori</th>
                        </tr>
                    </thead>
                    <tbody id="tabelBody" class="text-gray-600 text-sm divide-y divide-gray-200">
                        <tr>
                            <td colspan="7" class="p-4 text-center text-gray-400">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
